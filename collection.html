<html lang="en">
<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1 class="text-center text-white mt-3">The Sartorial Expertise</h1>

    <header>
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">My Website</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">

                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                        <li class="nav-item"><a class="nav-link" href="collection.html">Collection</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                        <li class="nav-item"><a class="nav-link" href="how it works.html">How It Works</a></li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>

  <main>
    <div class="container py-5">
      <div class="toolbar">
        <div>
          <h2>Suit Collection</h2>
          <p>Select the products you want, then continue to checkout.</p>
        </div>
        <div class="checkout-box">
          <span id="cart-count">0 selected</span>
          <button class="btn btn-success" onclick="goToCheckout()">Checkout</button>
        </div>
      </div>

      <div class="row" id="product-list"></div>

      <div class="d-flex justify-content-center mt-4">
        <button class="btn btn-secondary me-2" onclick="prevPage()">Prev</button>
        <button class="btn btn-primary" onclick="nextPage()">Next</button>
      </div>
    </div>
  </main>

  <script>
    const products = [
      { name: "Classic Suit", price: 120, img: "https://i.pinimg.com/736x/96/0a/67/960a674ae51b5973c31506bdabd35f21.jpg" },
      { name: "Black Tuxedo", price: 100, img: "https://gentux.imgix.net/1643215828_GenerationTuxBlackNotchLapelTuxedoThreeQuatersShot.jpg" },
      { name: "Navy Formal Suit", price: 120, img: "https://i.pinimg.com/736x/c8/81/ec/c881ec2f1a03a800b019547aeda9db98.jpg" },
      { name: "Grey Business Suit", price: 100, img: "https://i.pinimg.com/736x/9d/b4/90/9db490e701c7e34ec8d33996e2953e56.jpg" },
      { name: "Slim Fit Suit", price: 150, img: "https://i.pinimg.com/736x/7c/66/ce/7c66ce24f4d9d2ec067d5ad50ad2217f.jpg" },
      { name: "Brown Tailored Suit", price: 120, img: "https://i.pinimg.com/736x/6e/d2/d0/6ed2d02a62076a05751f4c6cfc90b656.jpg" },
      { name: "Blue Gentleman Suit", price: 120, img: "https://i.pinimg.com/1200x/91/49/90/914990985678123a6c2af593303cf165.jpg" },
      { name: "Cream Wedding Suit", price: 120, img: "https://i.pinimg.com/736x/e2/db/e2/e2dbe27b8c75873a90ad92976058fef3.jpg" },
      { name: "Modern Classic Suit", price: 120, img: "https://i.pinimg.com/736x/12/5f/8c/125f8c61143497c806bd889d1c3cfccc.jpg" },
      { name: "Charcoal Suit", price: 120, img: "https://i.pinimg.com/1200x/7f/16/eb/7f16eb9f676e07ce912538897de7f6ce.jpg" },
      { name: "Double Breasted Suit", price: 120, img: "https://i.pinimg.com/1200x/bd/d1/18/bdd118d5cb2eaded22dbd7079f2833c1.jpg" },
      { name: "Luxury Formal Suit", price: 120, img: "https://i.pinimg.com/736x/d2/ba/0b/d2ba0bae2ad414f0645af1511d2373c7.jpg" },
      { name: "Elegant Black Suit", price: 120, img: "https://i.pinimg.com/1200x/72/82/74/7282740ca8a00a51d733a773f3abe565.jpg" },
      { name: "Wedding Tuxedo", price: 120, img: "https://i.pinimg.com/1200x/a9/b8/3c/a9b83c8cf35d2b04fca0d36f35f59f70.jpg" },
      { name: "Executive Suit", price: 120, img: "https://i.pinimg.com/736x/ca/59/b2/ca59b2b326647f3054dad1689890a3a8.jpg" },
      { name: "Dinner Suit", price: 120, img: "https://i.pinimg.com/1200x/34/e7/00/34e70016d1c17340edb94e968e979298.jpg" },
      { name: "Sharp Fit Suit", price: 120, img: "https://i.pinimg.com/736x/a4/d2/f7/a4d2f76752d39035b77cae30566835a1.jpg" },
      { name: "Premium Navy Suit", price: 120, img: "https://i.pinimg.com/1200x/45/a5/1e/45a51efed7666976a123945cdc746560.jpg" },
      { name: "Classic Black Suit", price: 120, img: "https://i.pinimg.com/736x/3b/bf/7e/3bbf7efc4b665e4a381160d1d3da734a.jpg" },
      { name: "White Dinner Jacket", price: 120, img: "https://i.pinimg.com/1200x/31/c9/a2/31c9a281319512b1d8dd815abec2a6e2.jpg" },
      { name: "Formal Blue Suit", price: 120, img: "https://i.pinimg.com/736x/c9/16/7c/c9167c9a1554d200e6270dc91fa16ead.jpg" },
      { name: "Tailored Grey Suit", price: 120, img: "https://i.pinimg.com/736x/24/3d/34/243d34039843335850a94519de565970.jpg" },
      { name: "Velvet Tuxedo", price: 120, img: "https://i.pinimg.com/736x/62/d1/6c/62d16c449d42d8ac65742ae652a7a5a4.jpg" },
      { name: "Classic Beige Suit", price: 120, img: "https://i.pinimg.com/736x/82/08/1e/82081eb67f42d3adfd01a24065bd8987.jpg" }
    ];

    let currentPage = 1;
    const itemsPerPage = 16;
    let selectedItems = JSON.parse(localStorage.getItem("cart")) || [];

    function saveCart() {
      localStorage.setItem("cart", JSON.stringify(selectedItems));
      document.getElementById("cart-count").textContent = `${selectedItems.length} selected`;
    }

    function isSelected(product) {
      return selectedItems.some(item => item.img === product.img);
    }

    function displayProducts() {
      const productList = document.getElementById("product-list");
      productList.innerHTML = "";

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const pageItems = products.slice(start, end);

      pageItems.forEach((product, index) => {
        const selected = isSelected(product);
        productList.innerHTML += `
          <div class="col-sm-6 col-lg-3 mb-4">
            <div class="card product-card h-100 ${selected ? "selected" : ""}">
              <img src="${product.img}" class="card-img-top" alt="${product.name}">
              <div class="card-body">
                <h5 class="card-title">${product.name}</h5>
                <p class="card-text">$${product.price}</p>
                <button class="btn ${selected ? "btn-outline-danger" : "btn-primary"} w-100" onclick="toggleCart(${start + index})">
                  ${selected ? "Remove Selected" : "Select Item"}
                </button>
              </div>
            </div>
          </div>
        `;
      });

      saveCart();
    }

    function toggleCart(index) {
      const product = products[index];
      if (isSelected(product)) {
        selectedItems = selectedItems.filter(item => item.img !== product.img);
      } else {
        selectedItems.push(product);
      }
      displayProducts();
    }

    function nextPage() {
      if (currentPage * itemsPerPage < products.length) {
        currentPage++;
        displayProducts();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        displayProducts();
      }
    }

    function goToCheckout() {
      if (selectedItems.length === 0) {
        alert("Please select at least one product before checkout.");
        return;
      }
      window.location.href = "payment.html";
    }

    displayProducts();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
