<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - The Sartorial Expertise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>The Sartorial Expertise</h1>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">The Sartorial Expertise</a>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="payment-layout">
      <section class="order-summary">
        <h2>Your Order</h2>
        <div id="order-items"></div>
        <div class="order-total">
          <span>Total</span>
          <strong id="order-total">$0</strong>
        </div>
      </section>

      <section class="payment-panel">
        <h2>Payment Details</h2>
        <form id="payment-form">
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Names</label>
            <input type="text" class="form-control" id="fullName" required>
          </div>
          <div class="mb-3">
            <label for="cellphone" class="form-label">Cellphone Number</label>
            <input type="tel" class="form-control" id="cellphone" required>
          </div>
          <div class="mb-3">
            <label for="cardNumber" class="form-label">Card Number</label>
            <input type="text" class="form-control" id="cardNumber" minlength="12" maxlength="19" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Complete Payment</button>
        </form>
      </section>
    </div>
  </main>

  <script>
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const orderItems = document.getElementById("order-items");
    const orderTotal = document.getElementById("order-total");

    if (cart.length === 0) {
      orderItems.innerHTML = `<p>No products selected. <a href="index.html">Go back to shop</a>.</p>`;
    } else {
      orderItems.innerHTML = cart.map(item => `
        <div class="order-item">
          <img src="${item.img}" alt="${item.name}">
          <div>
            <strong>${item.name}</strong>
            <p>$${item.price}</p>
          </div>
        </div>
      `).join("");
    }

    const total = cart.reduce((sum, item) => sum + Number(item.price), 0);
    orderTotal.textContent = `$${total}`;

    document.getElementById("payment-form").addEventListener("submit", function(event) {
      event.preventDefault();

      if (cart.length === 0) {
        alert("Please select products before completing payment.");
        window.location.href = "index.html";
        return;
      }

      const fullName = document.getElementById("fullName").value.trim();
      const cellphone = document.getElementById("cellphone").value.trim();
      const cardNumber = document.getElementById("cardNumber").value.trim();

      if (!fullName || !cellphone || !cardNumber) {
        alert("Please complete all payment fields.");
        return;
      }

      localStorage.removeItem("cart");
      window.location.href = "thanks.html";
    });
  </script>
</body>
</html>
